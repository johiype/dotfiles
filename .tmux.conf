set -g mouse on

setw -g mode-keys vi

set -s set-clipboard on

#####################################################################
#
#  Below settings are used to use the tmux session name as the 
#    tab title name of the terminal software.
#

# Enable terminal setting titles
set-option -g set-titles on

# Set the tab title format to show the tmux session name
set-option -g set-titles-string "tmux: #S"


#####################################################################
#
#         Settings for TMUX Resurrect & Continuum Plugin
#
#####################################################################

# Set tmux-continuum to save tmux session every 5 minutes
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'

# Preseve scrollback history
set -g @resurrect-capture-pane-contents 'on'

# Track and restore SSH sessions
set -g @resurrect-processes 'ssh'

# Preserve Vim
set -g @resurrect-strategy-vim 'session'

# Preserve Neovim
set -g @resurrect-strategy-nvim 'session'


set -g status-right 'Continuum status: #{continuum_status}'

#####################################################################
#
#                 TMUX Plugin Management
#
#####################################################################
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Must be the last plugin in the list
set -g @plugin 'tmux-plugins/tmux-continuum'


#####################################################################





#⚠️⚠️⚠️⚠️ Keep this line at the very bottom of tmux.conf 
#Initialize TMUX plugin man
run '~/.tmux/plugins/tpm/tpm'
